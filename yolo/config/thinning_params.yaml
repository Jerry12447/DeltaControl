# 整合疏苗算法參數配置
integrated_thinning_node:
  ros__parameters:
    # YOLO辨識參數
    model_path: 'models/best.pt'
    confidence_threshold: 0.5
    iou_threshold: 0.45
    target_class: 'Crop'
    device: 'cpu'
    verbose: false
    
    # 疏苗算法參數
    min_confidence: 0.5
    min_plant_distance_mm: 150.0
    pixel_to_mm_ratio: 0.9864
    
    # 影像參數
    input_topic: '/camera/camera/color/image_raw'
